# .streamlit/secrets.toml for ReWA.AI
# Place this file in your project's .streamlit/ folder:
#   <project_folder>/.streamlit/secrets.toml

[auth]
# Note: Streamlit's default port is 8501. If you run on a custom port, match it here.
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "rewa-ai-secure-cookie-secret-key-32chars"
# Replace 'xxx' with your Google Cloud OAuth Client ID & Secret:
client_id = "xxx.apps.googleusercontent.com"
client_secret = "xxx"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Demo login for local development / testing without API keys:
[dev]
enabled = true

# Optional: Twilio Verify for phone SMS OTP login:
# [twilio]
# account_sid = "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# auth_token = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# verify_sid = "VAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
